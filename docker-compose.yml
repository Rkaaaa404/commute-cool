services:
  # ============================================================
  # PostgreSQL + PostGIS Database
  # ============================================================
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: commute_cool_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: commute_cool
      POSTGRES_USER: cc_user
      POSTGRES_PASSWORD: cc_dev_pass
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/seed_transit.sql:/docker-entrypoint-initdb.d/02_seed_transit.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cc_user -d commute_cool"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================================================
  # Apache Spark Pipeline (Local Mode)
  # Runs: Ingestion (real APIs) → 5 Spark Jobs → Data in PostGIS
  # One-shot: exits after pipeline completes
  # ============================================================
  spark-pipeline:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: commute_cool_spark
    depends_on:
      postgres:
        condition: service_healthy
      namenode:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://cc_user:cc_dev_pass@postgres:5432/commute_cool
      RAW_DATA_DIR: /app/data/raw
      SPARK_MASTER_URL: "local[*]"
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      WAQI_API_TOKEN: ${WAQI_API_TOKEN:-}
      PYSPARK_PYTHON: python3
      SPARK_LOCAL_DIRS: /tmp/spark
      HDFS_NAMENODE: hdfs://namenode:9000
    command: ["-m", "spark_jobs.run_pipeline"]
    volumes:
      - spark_data:/app/data

  # ============================================================
  # HDFS Namenode & Datanode (Hadoop Cluster)
  # ============================================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: commute_cool_namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=commute_cool
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop_namenode:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: commute_cool_datanode
    ports:
      - "9864:9864"
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    depends_on:
      - namenode

  # ============================================================
  # FastAPI Backend (connects to real PostGIS data)
  # ============================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: commute_cool_api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cc_user:cc_dev_pass@postgres:5432/commute_cool
      ASYNC_DATABASE_URL: postgresql+asyncpg://cc_user:cc_dev_pass@postgres:5432/commute_cool
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      WAQI_API_TOKEN: ${WAQI_API_TOKEN:-}
    restart: unless-stopped

volumes:
  pgdata:
  spark_data:
  hadoop_namenode:
  hadoop_datanode:
